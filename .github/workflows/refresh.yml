# .github/workflows/refresh.yml
# Free nightly refresh. Commits listings.json back to the repo; your static
# host redeploys automatically. No server, no database, no hosting bill.
name: Refresh listings

on:
  schedule:
    - cron: "0 9 * * *"      # 09:00 UTC ≈ 4am Central
  workflow_dispatch:          # lets you trigger it by hand

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull listings
        env:
          RENTCAST_API_KEY: ${{ secrets.RENTCAST_API_KEY }}
        run: node ingest.js

      - name: Commit if changed
        run: |
          git config user.name  "listings-bot"
          git config user.email "bot@users.noreply.github.com"
          git add listings.json
          git diff --staged --quiet || git commit -m "Refresh listings $(date -u +%F)"
          git push
